# desktop-release: builds Kian for macOS and Windows and attaches the
# installers to a GitHub Release, which the website's download buttons link
# to (apps/web/src/downloads.ts). Push a tag that matches the desktop app's
# version (v0.1.0 for apps/desktop/package.json 0.1.0) to release,
# or run it by hand from the Actions tab to get the files as artifacts.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One release per tag, made before the builds start. Without it the Mac and
  # Windows jobs each create a release at the same moment and the files split.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create the release
        run: |
          notes="Kian for macOS (Apple silicon and Intel) and Windows. Builds are unsigned, so on a Mac open it the first time with right-click, Open, and on Windows choose More info, Run anyway."
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Kian $GITHUB_REF_NAME" --notes "$notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    # still runs by hand (no tag, so no release job)
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: dist:mac
          - os: windows-latest
            target: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kian/desktop test
      - name: Build and publish
        run: pnpm --filter @kian/desktop ${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds until signing certificates are added as secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: kian-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: ignore
