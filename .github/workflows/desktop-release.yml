# desktop-release: builds Kian for macOS and Windows and attaches the
# installers to a GitHub Release, which the website's download buttons link
# to (apps/web/src/downloads.ts). Push a tag that matches the desktop app's
# version (v0.1.0 for apps/desktop/package.json 0.1.0) to release,
# or run it by hand from the Actions tab to get the files as artifacts.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One release per tag, made before the builds start. Without it the Mac and
  # Windows jobs each create a release at the same moment and the files split.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create the release
        run: |
          notes="Kian for macOS (Apple silicon and Intel) and Windows. Not yet signed with an Apple Developer ID. On a Mac, open it once, then go to System Settings, Privacy and Security, and choose Open Anyway. On Windows, choose More info, then Run anyway. Step by step, with every screen: https://kiandesk.vercel.app/guide"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Kian $GITHUB_REF_NAME" --notes "$notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    # still runs by hand (no tag, so no release job)
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: dist:mac
          - os: windows-latest
            target: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kian/desktop test
      - name: Build and publish
        shell: bash
        run: |
          publish=${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
          extra=()
          # With a Developer ID certificate in the secrets, sign with it and
          # notarize; without one, electron-builder.yml signs ad hoc. The
          # signing variables are set only here: electron-builder reads an
          # empty CSC_LINK as a file path and fails.
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CERT_P12_BASE64" ]; then
            export CSC_LINK="$MAC_CERT_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            export APPLE_ID="$MAC_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_PASSWORD" APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
            extra=(-c.mac.identity=null -c.mac.notarize=true)
          fi
          pnpm --filter @kian/desktop ${{ matrix.target }} --publish "$publish" "${extra[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Developer ID signing and notarization, used only when these secrets exist
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: kian-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: ignore
