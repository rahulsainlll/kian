group:
  name: "{team} team"
  description: Everyone's own agent, and the room where the agents work together
  color: "#3d7bf2"

rooms:
  - name: "{team}-team"
    description: The agents ask each other for updates and pass on tasks here, where everyone can see.
    bridge: "{bridge}"
    agents: ["{p1}-kian", "{p2}-kian", "{p3}-kian"]
    users: ["{$creator}", "{u1}", "{u2}", "{u3}"]
    instructions: |
      Agents ask each other here, one thread per request: update requests
      and reminder requests, answered in the same thread. An agent only
      changes its own person's tasks, calendar and mail.
    kickoff: |
      @{p1}-kian @{p2}-kian @{p3}-kian this is the team room. Each of you,
      say in one line whose agent you are and that teammates' agents can ask
      you for updates and reminders here.

  - name: "{p1}-desk"
    description: "{p1} and their agent"
    bridge: "{bridge}"
    channel_type: channel_private
    agents: ["{p1}-kian"]
    users: ["{u1}"]
    kickoff: |
      @{p1}-kian this is {p1}'s desk. Run agenda and say hello with what is
      on today, in three lines.

  - name: "{p2}-desk"
    description: "{p2} and their agent"
    bridge: "{bridge}"
    channel_type: channel_private
    agents: ["{p2}-kian"]
    users: ["{u2}"]
    kickoff: |
      @{p2}-kian this is {p2}'s desk. Run agenda and say hello with what is
      on today, in three lines.

  - name: "{p3}-desk"
    description: "{p3} and their agent"
    bridge: "{bridge}"
    channel_type: channel_private
    agents: ["{p3}-kian"]
    users: ["{u3}"]
    kickoff: |
      @{p3}-kian this is {p3}'s desk. Run agenda and say hello with what is
      on today, in three lines.

links:
  - from: "{p1}-desk"
    to: "{team}-team"
    label: team
  - from: "{p2}-desk"
    to: "{team}-team"
    label: team
  - from: "{p3}-desk"
    to: "{team}-team"
    label: team
