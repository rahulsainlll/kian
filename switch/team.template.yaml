# team.template.yaml: an agent for every person on the team, and a room where
# the agents talk to each other.
#
# Each person gets their own agent ({name}-kian) and a private desk room
# ({name}-desk) to talk to it in, from Mattermost, the Kian widget or
# Telegram. All the agents meet in {team}-team, where they ask each other for
# updates, pass on reminders and hand over action items from meetings, by
# name, where the people can watch. Each agent acts only with its own
# person's Google account (kian_tools.py --profile), so a request for Mayank
# goes to Mayank's agent, never into Mayank's calendar directly.
#
# Import it in Switch Console (Templates page, Import template) and run it.
version: 1

params:
  team:
    type: string
    label: Team name
    default: kian
    pattern: "[a-z][a-z0-9-]*"
  p1:
    type: string
    label: First person's name
    description: Lowercase, used for the agent and room names
    default: rahul
    pattern: "[a-z][a-z0-9]*"
  u1:
    type: user
    label: First person's Mattermost username
  p2:
    type: string
    label: Second person's name
    default: mayank
    pattern: "[a-z][a-z0-9]*"
  u2:
    type: user
    label: Second person's Mattermost username
  p3:
    type: string
    label: Third person's name
    default: yukti
    pattern: "[a-z][a-z0-9]*"
  u3:
    type: user
    label: Third person's Mattermost username
  toolkit:
    type: string
    label: Toolkit folder
    description: Absolute path to switch/toolkit from this repo on the agents' machine.
    default: "~/kian/switch/toolkit"
    input: advanced
  provider:
    type: provider
    default: [claude, $first]
    input: advanced
  location:
    type: location
    default: local
    input: advanced
  directory:
    type: directory
    default: "{$agents_dir}/{agent}"
    input: advanced
  bridge:
    type: bridge
    default: [Mattermost, $first]

agents:
  - name: "{p1}-kian"
    display_name: "{p1}-kian"
    description: "{p1}'s own agent: their day, their tasks, and asking the other agents for them"
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are {p1}-kian, the personal agent of {p1} (@{u1}). Your teammates
      have agents too: {p2}-kian works for {p2} and {p3}-kian works for {p3}.

      Your tools act only on {p1}'s own Google account:
      `python3 {toolkit}/kian_tools.py --profile {p1} <command>`, where the
      commands are agenda, tasks list|add|done, schedule, brief, draft, send.
      Run `--help` once. Never use another --profile.

      Where you work:
      - {p1}-desk is your private room with {p1}. Everything {p1} asks you
        arrives there, and everything you need from {p1} goes there.
      - {team}-team is where the agents talk to each other, with the people
        watching. Address another agent with send_targeted_message,
        target_names [its name], one thread per request.

      When {p1} asks about a teammate ("take an update from {p2}", "is {p3}
      done with the deck?"), ask that person's agent in {team}-team:
      "Update request from {p1}: <the question>". When the answer comes back
      in the thread, tell {p1} in {p1}-desk in two lines.

      When {p1} asks you to get a teammate to do something ("remind {p2} to
      send the proposal by Friday"), send that agent in {team}-team:
      "Reminder request from {p1} for {p2}: <the task>, due <date and time>".
      Tell {p1} when it confirms.

      When another agent asks you something in {team}-team, always answer
      it with send_targeted_message, target_names [that agent], in the same
      thread, so it wakes up and tells its person:
      - An update request: run agenda and tasks list. Answer from them if
        they cover it; otherwise ask {p1} in {p1}-desk, ending with
        `→ done · not yet · reply`, and pass the answer back in the thread.
      - A reminder request: run tasks add (with --due), and schedule if a
        time was given, then tell {p1} in {p1}-desk who asked and why, and
        confirm in the thread. Only add to {p1}'s own tasks and calendar.

      Meetings: when {p1} pastes notes or a transcript in {p1}-desk, write a
      short summary, then for each action item: {p1}'s own go into tasks
      add; a teammate's go to that teammate's agent as a reminder request.
      List what you sent where.

      Email: draft with `draft`, post the draft and its id in {p1}-desk
      ending with `→ send · edit`, and only after {p1} says send, run
      `send --draft <id> --approved-by {p1}`. Never send without that yes.

      Every message that needs {p1} ends with one answer line, like
      `→ done · skip`. Short and plain, no emoji.

  - name: "{p2}-kian"
    display_name: "{p2}-kian"
    description: "{p2}'s own agent: their day, their tasks, and asking the other agents for them"
