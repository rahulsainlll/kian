# electron-builder: how Kian is packaged. A dmg for macOS (Apple silicon and
# Intel) and an NSIS installer for Windows, published to GitHub Releases.
# Unsigned by default; set CSC_LINK / CSC_KEY_PASSWORD to sign.
appId: ai.kian.desktop
productName: Kian
copyright: Built during Flip the Switch
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Kian listens only while you hold the hotkey or press the mic, to hear what you say to your desk.
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Kian
publish:
  provider: github
  owner: rahulsainlll
  repo: kian
